// Aniko for Android (a TV's, mainly). Built by .github/workflows/android.yml,
// which first builds Aniko's server for Android into src/main/jniLibs (see
// README.md here).
plugins {
    id 'com.android.application'
}

def env = { String name, String fallback -> System.getenv(name) ?: fallback }

android {
    // app.kumo, from before Aniko was renamed (it was Kumo): Android takes
    // an update only for the same id, and TV launchers keep the app's
    // place by it.
    namespace 'app.kumo'
    compileSdk 35

    defaultConfig {
        applicationId 'app.kumo'
        minSdk 22
        targetSdk 34
        // 2.0.<commits since 2.0.0's>, like the other releases; the number
        // of commits is the version code.
        versionName env('ANIKO_VERSION', '1.0.0')
        versionCode env('ANIKO_VERSION_CODE', '1') as int
    }

    signingConfigs {
        release {
            storeFile file(env('ANIKO_KEYSTORE', "${rootDir}/../packaging/android/kumo.jks"))
            storePassword env('ANIKO_KEYSTORE_PASSWORD', 'kumo-android')
            keyAlias env('ANIKO_KEY_ALIAS', 'kumo')
            keyPassword env('ANIKO_KEY_PASSWORD', 'kumo-android')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // The server is a program, not a library: Android extracts it
    // (somewhere it may run it) only when it's stored this way.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

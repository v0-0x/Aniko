# Builds Aniko Hub, Aniko's server alone made for a Raspberry Pi (or any
# Linux computer) that shares its library with the Aniko apps on the network
# and keeps them in step (aniko --hub, see server/internal/anikohub), and
# publishes it as the GitHub Release "Aniko Hub <version>", tagged
# hub-v<version> on the commit it built: one archive per processor,
# aniko-hub-<version>-linux-<arm64|arm|amd64>.tar.gz, each a folder with the
# aniko-hub program, its service and install script (packaging/hub).
#
# The program is static (pure Go, SQLite included), so one build runs on any
# Linux with that processor: arm64 for a 64-bit Raspberry Pi OS (or any
# 64-bit kernel), arm for a 32-bit one (ARMv7: Pi 2 and newer). The version
# is the other releases' (2.0.<commits since 2.0.0's>); installed hubs look
# for the hub-v release with the highest version and update from their
# dashboard (server/internal/update).
#
# Runs on every push to the repository's default branch (except pushes that
# only change docs or another system's packaging), and by hand from the
# Actions tab. Each one is a beta (a pre-release) unless the pushed commit's
# message says [stable] or it's run by hand as stable (see windows.yml). The
# newest 10 stable releases and the newest 10 betas are kept.

name: Hub release

on:
  # Pushes to other branches are skipped (see the job's condition).
  push:
    paths-ignore:
      - "**.md"
      - "desktop/**"
      - "android/**"
      - "packaging/android/**"
      - "packaging/arch/**"
      - "packaging/macos/**"
      - "packaging/windows/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as the GitHub Release hub-v<version> (otherwise it's only kept as a workflow artifact)
        type: boolean
        default: true
      channel:
        description: "beta: a pre-release, offered to hubs with Beta updates on; stable: a release for everyone"
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hub:
    name: Build and package (Aniko Hub, Linux)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history: the version counts its commits.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The token stays out of .git/config, where the build's
          # dependencies (npm scripts…) could read it: only the release
          # steps get it.
          persist-credentials: false

      - name: Pick the channel
        id: channel
        env:
          INPUT: ${{ inputs.channel }}
        run: |
          if [ "$INPUT" = stable ] || git log -1 --format=%B | grep -qF '[stable]'; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "A stable release"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "A beta (pre-release)"
          fi

      - name: Read the version
        id: version
        run: |
          base=$(node -p 'require("./desktop/package.json").version')
          if ! [[ $base =~ ^([0-9]+)\.([0-9]+)\. ]]; then
            echo "::error::desktop/package.json has no version like 1.0.0 (it says '$base')"
            exit 1
          fi
          count=$(git rev-list --count HEAD)
          from=$(node -p 'require("./desktop/package.json").anikoVersionBase || 0')
          patch=$(( count - from ))
          if (( patch < 0 )); then
            echo "::error::This commit is before anikoVersionBase ($from) in desktop/package.json"
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$patch"
          {
            echo "version=$version"
            echo "tag=hub-v$version"
          } >> "$GITHUB_OUTPUT"
          echo "Building Aniko Hub $version"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The dashboard is the web UI's (it shows the hub's own pages when the
      # server is a hub).
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Same as the Makefile's "embed" target.
      - name: Embed the web UI into the server
        run: |
          dist=server/internal/webui/dist
          rm -rf "$dist"
          mkdir -p "$dist"
          cp -R web/dist/. "$dist/"
          touch "$dist/.keep"

      - name: Test the hub
        working-directory: server
        run: go test ./internal/anikohub/ ./internal/share/ ./internal/update/ ./internal/stream/ ./internal/api/

      # Without cgo: the program stands alone (no C library needed).
      - name: Build the hub for each processor
        working-directory: server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          config=github.com/v0-0x/Aniko/server/internal/config
          out=../dist/hub
          mkdir -p "$out"
          build() {
            local arch=$1 goarm=${2:-}
            local dir="$out/aniko-hub-$VERSION-linux-$arch"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$goarm \
              go build -trimpath -ldflags "-s -w -X $config.AppVersion=$VERSION -X $config.Commit=$GITHUB_SHA" -o "$dir/aniko-hub" ./cmd/aniko
            cp ../packaging/hub/install.sh ../packaging/hub/aniko-hub.service ../packaging/hub/README.md "$dir/"
            chmod 755 "$dir/aniko-hub" "$dir/install.sh"
            tar -czf "$out/aniko-hub-$VERSION-linux-$arch.tar.gz" -C "$out" "aniko-hub-$VERSION-linux-$arch"
            # Aniko Hub was Kumo Hub before 2.0.37: Kumo Hub's updater (2.0.36
            # and older) takes kumo-hub-<version>-linux-<arch>.tar.gz and the
            # kumo-hub program in it, the same hub under its old name.
            local old="$out/old/kumo-hub-$VERSION-linux-$arch"
            mkdir -p "$old"
            cp "$dir/aniko-hub" "$old/kumo-hub"
            tar -czf "$out/kumo-hub-$VERSION-linux-$arch.tar.gz" -C "$out/old" "kumo-hub-$VERSION-linux-$arch"
          }
          build arm64
          build arm 7
          build amd64
          file "$out"/*/aniko-hub
          ls -la "$out"

      # The amd64 one runs here: it starts as a hub, answers, and stops.
      - name: Check the hub starts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="dist/hub/aniko-hub-$VERSION-linux-amd64"
          "$dir/aniko-hub" --version | grep -qF "$VERSION"
          home="$RUNNER_TEMP/hubhome"
          mkdir -p "$home"
          HOME="$home" "$dir/aniko-hub" --port 43299 > "$RUNNER_TEMP/hub.log" 2>&1 &
          pid=$!
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:43299/api/status > "$RUNNER_TEMP/status.json" 2> /dev/null && break
            sleep 1
          done
          cat "$RUNNER_TEMP/hub.log"
          grep -q '"hub"' "$RUNNER_TEMP/status.json" || { echo "::error::the hub didn't answer as a hub"; cat "$RUNNER_TEMP/status.json"; exit 1; }
          kill "$pid"
          wait "$pid" || true
          HOME="$home" "$dir/aniko-hub" --setup-code | grep -qE '^[0-9]{4}-[0-9]{4}$'

      - name: Upload the archives (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: aniko-hub-${{ steps.version.outputs.version }}
          path: dist/hub/*.tar.gz
          overwrite: true
          if-no-files-found: error

      # Creates the release (and its tag, on this commit, when it doesn't
      # exist yet), or updates it. It isn't marked as the repository's latest
      # release, which stays the Windows one.
      - name: Publish the GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          notes="$RUNNER_TEMP/release-notes.md"
          beta=""
          [ "$CHANNEL" = beta ] && beta=" --beta"
          cat > "$notes" <<EOF
          **Aniko Hub $VERSION**: Aniko without a player, for a Raspberry Pi (Pi 4 or 5) or any Linux computer that stays on. It shares its library with the Aniko apps on your network (computers, TVs, phones), keeps the same AniList account's progress, list and theme in step on all of them as it changes, and takes their downloads if you let it. Its dashboard, in a browser, shows what it's streaming to whom, the devices and the Pi's CPU, memory, temperature and disks.

          **Install** (on the Pi, as your usual user, with Raspberry Pi OS 64-bit best):

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/packaging/hub/install.sh | bash -s --$beta
          \`\`\`

          It installs the hub for your Pi's processor and ffmpeg, starts it as a service, and prints the dashboard's address (\`http://<your Pi>.local:43211\`) and a setup code to set its password. Then, on each device with Aniko, turn on **Settings › Other devices**: the hub shows up there.

          | File | For |
          |---|---|
          | \`aniko-hub-$VERSION-linux-arm64.tar.gz\` | 64-bit Raspberry Pi OS (Pi 3, 4, 5), any 64-bit ARM Linux |
          | \`aniko-hub-$VERSION-linux-arm.tar.gz\` | 32-bit Raspberry Pi OS (Pi 2 and newer) |
          | \`aniko-hub-$VERSION-linux-amd64.tar.gz\` | A Linux PC (x86-64) |

          Or unpack one and run its \`./install.sh\`. The hub updates itself from its dashboard. More: [packaging/hub/README.md]($repo/blob/$GITHUB_SHA/packaging/hub/README.md).

          Built from $GITHUB_SHA by [workflow run $GITHUB_RUN_NUMBER]($repo/actions/runs/$GITHUB_RUN_ID).
          EOF
          if [ "$CHANNEL" = beta ]; then
            pre=true title="Aniko Hub $VERSION beta"
            { printf '%s\n\n' "> **Beta.** This version is a pre-release: hubs are offered it only with **Beta updates** on (the install command above turns it on). It may have rough edges; the stable releases are the ones without this note."; cat "$notes"; } > "$notes.new" && mv "$notes.new" "$notes"
          else
            pre=false title="Aniko Hub $VERSION"
          fi
          files=(dist/hub/*.tar.gz)
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "Updating the release $TAG"
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease="$pre" --latest=false
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "Creating the release $TAG"
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --prerelease="$pre" --latest=false
          fi

      # Keep the newest 10 stable hub releases and the newest 10 betas, by
      # version (numbers compared as numbers), and delete the older ones with
      # their tags: betas never push out the stable releases.
      - name: Delete old releases
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          list=$(gh release list --limit 1000 --json tagName,isPrerelease --jq '.[] | "\(.isPrerelease) \(.tagName)"')
          old=$(for pre in true false; do
            printf '%s\n' "$list" | awk -v pre="$pre" '$1 == pre { print $2 }' |
              { grep -E '^hub-v[0-9]+(\.[0-9]+)*$' || true; } | sort -V -r | tail -n +11
          done)
          if [ -z "$old" ]; then
            echo "No old releases to delete"
            exit 0
          fi
          for tag in $old; do
            echo "Deleting the release $tag and its tag"
            gh release delete "$tag" --cleanup-tag --yes
          done

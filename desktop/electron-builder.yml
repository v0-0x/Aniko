# electron-builder config for the WINDOWS and MACOS releases:
#   - Windows: the installer and the portable zip, built by
#     packaging/windows/build.ps1 and the "Windows release" workflow
#     (.github/workflows/windows.yml), in ../dist/windows/release.
#   - macOS: one universal app for Apple silicon and Intel Macs, as a disk
#     image and a zip (which the app's updates download), built by the
#     "macOS release" workflow (.github/workflows/macos.yml), which puts them
#     in ../dist/macos/release (-c.directories.output).
# The Arch Linux package doesn't use it: packaging/arch/PKGBUILD installs
# main.js, preload.js and package.json for the system electron.
#
# Build the server first: dist/windows/aniko.exe ships as resources\aniko.exe,
# dist/macos/aniko-x64 and aniko-arm64 as Aniko.app/Contents/Resources/aniko
# (merged into one program that runs on both), where main.js looks for it.

appId: app.kumo.desktop # also the AppUserModelID set in main.js
productName: Aniko
# Publisher shown in the exe's details and in Settings > Apps (otherwise the
# exe keeps Electron's "GitHub, Inc.").
extraMetadata:
  author:
    name: Aniko
publish: null # the workflows upload the releases; Aniko updates itself
npmRebuild: false # no native modules

directories:
  output: ../dist/windows/release

files:
  - main.js
  - preload.js
  - icon.png
  - package.json

beforePack: ./check-server.js # fails the build when the server is missing

# Aniko's app can't be used as a Node.js to run other code (with its
# permissions, on macOS): no ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect.
# main.js starts the server with spawn, which doesn't need them.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false

win:
  icon: icon.png
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  # The portable zip's name (the installer's is set below).
  artifactName: Aniko-${version}-windows-${arch}-portable.${ext}
  extraResources:
    - from: ../dist/windows/aniko.exe
      to: aniko.exe
    # The setup that installs the programs Aniko uses (Scoop, Git, ani-cli,
    # ffmpeg, mpv...): the installer offers to run it (installer.nsh), and
    # aniko.exe has the same script built in for Settings > Desktop app & programs.
    - from: ../server/internal/winsetup/install-tools.ps1
      to: install-tools.ps1

nsis:
  artifactName: Aniko-Setup-${version}-windows-${arch}.${ext}
  oneClick: false
  perMachine: false
  # Always installs for the current user (no admin rights, no "for all
  # users?" page).
  include: ../packaging/windows/installer.nsh
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aniko
  differentialPackage: false # no auto-update, so no .blockmap

mac:
  # macOS app icons leave a margin around the tile (Apple's icon grid).
  icon: ../packaging/macos/icon.png
  category: public.app-category.entertainment
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: Aniko-${version}-macos-${arch}.${ext}
  # Packed once for each architecture with its own server (${arch} is x64,
  # then arm64), which the universal app merges into one program.
  extraResources:
    - from: ../dist/macos/aniko-${arch}
      to: aniko
    # Kumo's updater (2.0.36 and older; Aniko's old name) takes a new app
    # only with its server at Contents/Resources/kumo: a stand-in there.
    - from: ../packaging/macos/kumo
      to: kumo
  # Aniko isn't signed with an Apple Developer ID: it's signed ad hoc ("-"),
  # which Apple silicon Macs need to run it at all. The hardened runtime is
  # for notarized apps; with an ad hoc signature it would stop the app from
  # loading its own frameworks.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    # Shown when Aniko first reaches a device on the network (a torrent
    # client, a Chromecast…).
    NSLocalNetworkUsageDescription: Aniko connects to devices on your network, like your torrent client or other computers running Aniko.

dmg:
  # The window: Aniko on the left, the Applications folder on the right.
  title: Aniko ${version}
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
